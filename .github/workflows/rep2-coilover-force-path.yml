name: Rep2 C0 Force Path

on:
  push:
    branches:
      - experiment/rep2-coilover-force-path

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
