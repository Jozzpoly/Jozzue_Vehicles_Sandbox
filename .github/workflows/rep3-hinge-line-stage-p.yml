name: Rep3 Hinge Line Stage P

on:
  push:
    branches:
      - experiment/rep3-geometry-derived-hinge-line

jobs:
  stage-p-substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile and run inherited + Rep3 source tests
        run: npm run test
      - name: Emit exact Stage P hinge-axis evidence
        run: node scripts/rep3-stage-p-evidence.mjs artifacts/rep3-stage-p-hinge-axis.json
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rep3-stage-p-hinge-axis-evidence
          path: artifacts/rep3-stage-p-hinge-axis.json
          if-no-files-found: warn
