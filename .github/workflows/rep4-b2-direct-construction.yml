name: Rep4 B2 Direct Construction

on:
  push:
    branches:
      - experiment/rep4-multi-relation-corner

jobs:
  direct-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run source tests and production build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real Chromium Rep4 B2 direct-construction preflight
        run: npx playwright test --config=playwright.rep4-b2.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rep4-b2-direct-construction
          path: |
            artifacts/rep4-b2-*.png
            test-results/rep4-b2
          if-no-files-found: warn
