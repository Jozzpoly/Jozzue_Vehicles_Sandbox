name: Rep3 Hinge Line Stage B Preflight

on:
  push:
    branches:
      - experiment/rep3-geometry-derived-hinge-line

jobs:
  rendered-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run inherited source tests and production build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real Chromium Rep3 Stage B interaction preflight
        run: npx playwright test --config=playwright.rep3-stage-b.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rep3-stage-b-rendered-preflight
          path: |
            artifacts/rep3-stage-b-*.png
            test-results/rep3-stage-b
          if-no-files-found: warn
