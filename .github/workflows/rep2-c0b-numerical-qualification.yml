name: Rep2 C0b Numerical Qualification

on:
  push:
    branches:
      - experiment/rep2-c0b-numerical-qualification

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
