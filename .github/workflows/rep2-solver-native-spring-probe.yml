name: Rep2 Solver Native Spring Probe

on:
  push:
    branches:
      - research/rep2-solver-native-spring-seam

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/rep2-solver-native-spring-probe.mjs
