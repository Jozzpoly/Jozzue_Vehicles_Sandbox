name: S0 Suspension Composition Feasibility

on:
  push:
    branches:
      - experiment/s0-suspension-composition-feasibility

jobs:
  two-arm-upright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile and run inherited + S0 tests
        run: npm run test
      - name: Emit exact S0 two-arm/upright composition evidence
        run: node scripts/s0-composition-evidence.mjs artifacts/s0-two-arm-upright-composition.json
      - name: Production build regression
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0-two-arm-upright-composition-evidence
          path: artifacts/s0-two-arm-upright-composition.json
          if-no-files-found: warn
