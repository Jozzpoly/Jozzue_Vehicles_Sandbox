name: Rep4 B3 Build Play Build

on:
  push:
    branches:
      - experiment/rep4-b3-build-play-build

jobs:
  build-play-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run source tests and production build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Re-run B1 rendered correspondence regression
        run: npx playwright test --config=playwright.rep4-b1.config.ts
      - name: Re-run B2 direct-construction regression
        run: npx playwright test --config=playwright.rep4-b2.config.ts
      - name: Run real Chromium Rep4 B3 causal build-play-build gate
        run: npx playwright test --config=playwright.rep4-b3.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rep4-b3-build-play-build
          path: |
            artifacts/rep4-b3-*.png
            test-results/rep4-b3
          if-no-files-found: warn
