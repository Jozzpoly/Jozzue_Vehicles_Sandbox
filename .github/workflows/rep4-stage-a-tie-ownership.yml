name: Rep4 Stage A Causal Composition

on:
  push:
    branches:
      - experiment/rep4-multi-relation-corner

jobs:
  causal-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile and run inherited + Rep4 tests
        id: tests
        continue-on-error: true
        run: npm run test
      - name: Emit Rep4 A3 tie diagnostics
        if: always()
        run: node scripts/rep4-tie-diagnostics.mjs artifacts/rep4-tie-diagnostics.json
      - name: Emit Rep4 A4 damper diagnostics
        if: always()
        run: node scripts/rep4-damper-diagnostics.mjs artifacts/rep4-damper-diagnostics.json
      - name: Production build regression
        if: always()
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rep4-stage-a-diagnostics
          path: |
            artifacts/rep4-tie-diagnostics.json
            artifacts/rep4-damper-diagnostics.json
          if-no-files-found: error
      - name: Preserve causal gate result
        if: steps.tests.outcome != 'success'
        run: exit 1
